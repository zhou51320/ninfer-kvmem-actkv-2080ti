name: Build NInfer ActKV for RTX 2080 Ti

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ninfer-actkv-2080ti.yml'
      - 'backends/versions.json'
      - 'backends/patches/ninfer-kvmem.patch'
      - 'kvmem/**'
      - 'scripts/prepare-backends.py'

permissions:
  contents: read

concurrency:
  group: ninfer-actkv-2080ti-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ninfer:
    runs-on: ubuntu-24.04
    # NInfer's CUDA sm_75 build can exceed three hours on the hosted runner.
    # Keep enough headroom for the complete compile, verification and packaging.
    timeout-minutes: 360
    container: nvidia/cuda:13.2.0-devel-ubuntu24.04
    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential cmake ninja-build \
            python3 patchelf binutils file libssl-dev pkg-config zstd \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev \
            libcurl4-openssl-dev time

      - uses: actions/checkout@v4

      - name: Prepare and verify the pinned NInfer/ActKV integration
        run: |
          # The CUDA container runs as root while checkout files belong to the
          # runner user; allow Git to inspect both the superproject and the
          # submodule without triggering dubious-ownership protection.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/backends/ninfer"
          python3 scripts/prepare-backends.py --backend ninfer
          python3 scripts/prepare-backends.py --backend ninfer --check
          git -C backends/ninfer rev-parse HEAD

      - name: Configure NInfer for Turing sm_75
        run: |
          cmake -S backends/ninfer -B build/ninfer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNINFER_BUILD_APPS=ON \
            -DNINFER_BUILD_BENCHMARKS=OFF \
            -DBUILD_TESTING=OFF \
            -DNINFER_KVMEM_SOURCE_DIR="$GITHUB_WORKSPACE/kvmem" \
            -DCMAKE_CUDA_ARCHITECTURES=75 \
            -DCMAKE_C_FLAGS='-march=x86-64 -mtune=generic' \
            -DCMAKE_CXX_FLAGS='-march=x86-64 -mtune=generic' \
            -DCMAKE_CUDA_FLAGS='-Xcompiler=-march=x86-64 -Xcompiler=-mtune=generic'

      - name: Build ninfer-serve
        run: |
          nproc
          free -h
          # Ninja's -k 0 keeps compiling independent translation units after
          # failures, so the build log contains the full set of compiler errors.
          /usr/bin/time -v cmake --build build/ninfer --parallel 4 --target ninfer-serve -- -k 0

      - name: Verify binary and DFlash/ActKV symbols
        run: |
          BIN=$(find build/ninfer -type f -name ninfer-serve -perm -111 | head -n 1)
          test -n "$BIN"
          test -x "$BIN"
          printf 'Built binary: %s\n' "$BIN"
          file "$BIN"
          readelf -h "$BIN"
          strings "$BIN" | grep -qi kvmem
          # DFlash/ActKV may be compiled into static code without retaining
          # the feature name in the final stripped executable. Verify the
          # checked-out integration sources and the binary independently.
          grep -RiqE 'dflash|actkv|kvmem-lrfu' backends/ninfer kvmem
          printf 'BIN=%s\n' "$BIN" >> "$GITHUB_ENV"

      - name: Package executable and runtime libraries
        run: |
          rm -rf dist
          mkdir -p dist/lib
          cp "$BIN" dist/ninfer-kvmem-actkv-2080ti
          patchelf --set-rpath '$ORIGIN:$ORIGIN/lib' dist/ninfer-kvmem-actkv-2080ti

          ldd dist/ninfer-kvmem-actkv-2080ti \
            | tee dist/ldd-build.txt \
            | tee /tmp/ninfer-ldd-build.txt || true
          # libcuda is supplied by the installed NVIDIA driver on the target
          # machine and must not be bundled. Gather all other unresolved SONAMEs.
          if grep 'not found' /tmp/ninfer-ldd-build.txt \
              | grep -vE '^[[:space:]]*libcuda\.so\.1[[:space:]]+=> not found$' \
              > /tmp/ninfer-unresolved-build.txt; then
            echo 'Unresolved build-time shared-library dependencies:' >&2
            cat /tmp/ninfer-unresolved-build.txt >&2
            exit 1
          fi
          awk '/=> \/\// {print $3} /^\/[^ ]+ \(/ {print $1}' /tmp/ninfer-ldd-build.txt \
            | sort -u \
            | while read -r lib; do
                [ -n "$lib" ] || continue
                base=$(basename "$lib")
                case "$base" in
                  libc.so*|libm.so*|libpthread.so*|librt.so*|libdl.so*|libresolv.so*|libutil.so*|ld-linux*|libcuda.so*)
                    continue ;;
                esac
                cp -L "$lib" "dist/lib/$base"
              done

          # FFmpeg may also be opened by the media backend at runtime rather
          # than appearing in the executable's direct DT_NEEDED table. Bundle
          # Ubuntu 24.04's stable FFmpeg 6 SONAME family explicitly.
          package_failures=0
          for soname in libavformat.so.60 libavcodec.so.60 libavutil.so.58 libswscale.so.7 libswresample.so.4; do
            lib=$(ldconfig -p | awk -v name="$soname" '$1 == name {print $NF; exit}')
            if [ -z "$lib" ] || [ ! -f "$lib" ]; then
              echo "Required offline runtime dependency not installed: $soname" >&2
              package_failures=$((package_failures + 1))
              continue
            fi
            cp -L "$lib" "dist/lib/$soname"
          done

          cat > dist/ninfer <<'EOF'
          #!/bin/sh
          set -eu
          HERE=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          export LD_LIBRARY_PATH="$HERE/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$HERE/ninfer-kvmem-actkv-2080ti" "$@"
          EOF
          chmod +x dist/ninfer

          LD_LIBRARY_PATH="$PWD/dist/lib" ldd dist/ninfer-kvmem-actkv-2080ti \
            | tee dist/ldd-bundled.txt || true
          if grep 'not found' dist/ldd-bundled.txt \
              | grep -vE '^[[:space:]]*libcuda\.so\.1[[:space:]]+=> not found$' \
              > /tmp/ninfer-unresolved-bundled.txt; then
            echo 'Packaged artifact has unresolved runtime dependencies:' >&2
            cat /tmp/ninfer-unresolved-bundled.txt >&2
            package_failures=$((package_failures + 1))
          fi
          if ! grep -q 'libavformat.so.60 => .*/dist/lib/libavformat.so.60' dist/ldd-bundled.txt; then
            echo 'libavformat.so.60 is not resolving from the artifact bundle' >&2
            package_failures=$((package_failures + 1))
          fi
          # GitHub's build container intentionally has no NVIDIA driver, so
          # libcuda.so.1 is absent. Use CUDA's SDK stub only for this CI smoke
          # test. It stays outside dist and is never shipped: on the offline
          # target the real libcuda.so.1 must come from its installed driver.
          test_driver_stub_dir=$(mktemp -d)
          test_driver_stub=$(find /usr/local/cuda -path '*/stubs/libcuda.so' -type f -print -quit)
          if [ -z "$test_driver_stub" ]; then
            echo 'CUDA SDK libcuda stub is unavailable for CI smoke test' >&2
            package_failures=$((package_failures + 1))
          else
            cp -L "$test_driver_stub" "$test_driver_stub_dir/libcuda.so.1"
          fi
          if ! LD_LIBRARY_PATH="$PWD/dist/lib:$test_driver_stub_dir" dist/ninfer --version; then
            echo 'Packaged executable --version smoke test failed' >&2
            package_failures=$((package_failures + 1))
          fi
          rm -rf "$test_driver_stub_dir"

          printf 'Run offline with: ./ninfer --version\n' > dist/README.txt

          printf 'Packaged files:\n'
          find dist -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
          tar -C dist -czf ninfer-kvmem-actkv-2080ti-sm75-cuda13.tar.gz .
          if [ "$package_failures" -ne 0 ]; then
            echo "Packaging validation found $package_failures failure(s); see all diagnostics above." >&2
            exit 1
          fi

      - name: Upload RTX 2080 Ti artifact
        uses: actions/upload-artifact@v4
        with:
          name: ninfer-kvmem-actkv-2080ti-sm75-cuda13
          path: |
            dist/**
            ninfer-kvmem-actkv-2080ti-sm75-cuda13.tar.gz
          if-no-files-found: error
          retention-days: 30
